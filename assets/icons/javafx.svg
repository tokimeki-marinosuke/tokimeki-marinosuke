<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <title>JavaFX</title>
  <desc>OpenJFX logo arranged as a compact square tile.</desc>
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14" /></clipPath>
    <image id="logo" width="591" height="222" xlink:href="data:image/png;base64," />
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#FFFFFF" />
    <svg x="18" y="5" width="28" height="32" viewBox="0 0 195 222" overflow="hidden"><use xlink:href="#logo" /></svg>
    <svg x="6" y="41" width="52" height="17" viewBox="200 90 390 125" overflow="hidden"><use xlink:href="#logo" /></svg>
  </g>
</svg>
