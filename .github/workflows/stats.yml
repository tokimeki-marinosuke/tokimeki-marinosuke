name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=tokimeki-marinosuke&show_icons=true&theme=blue-green
          path: profile/stats-blue-green.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=tokimeki-marinosuke&layout=compact&theme=blue-green
          path: profile/top-langs-blue-green.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Activity Graph
        run: python3 .github/scripts/generate_activity_graph.py

      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub Stats" || exit 0
          git push
